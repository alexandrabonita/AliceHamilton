{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
      <div class="text-center mb-4">
        <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width: 60px; height: 60px;">
          <i class="bi bi-mortarboard-fill fs-3"></i>
        </div>
        <h4 class="fw-bold mb-0">Comunidad Kínder 3</h4>
        <small class="text-muted">Colegio Alice Hamilton</small>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 px-3 rounded-3 small mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
      </div>
      {% endif %}

      {% if mensaje %}
      <div class="alert alert-success py-2 px-3 rounded-3 small mb-3">
        <i class="bi bi-check-circle-fill me-1"></i> {{ mensaje }}
      </div>
      {% endif %}

      <form action="/login" method="post">
        <div class="mb-3">
          <label class="form-label small fw-bold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" name="username" class="form-control border-start-0" placeholder="ej. usuario" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 shadow-sm mb-3">
          Ingresar al Portal
        </button>
      </form>

      <div class="text-center pt-2 border-top">
        <small class="text-muted d-block mb-1">¿Eres papá o mamá de nuevo ingreso?</small>
        <a href="/registro-padre" class="btn btn-outline-success btn-sm w-100 fw-bold rounded-3">
          <i class="bi bi-person-plus-fill"></i> Registrarme con el nombre de mi hijo(a)
        </a>
      </div>

    </div>

  </div>
</div>
{% endblock %}
