{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-md-5">
    <div class="card shadow border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-6 text-primary mb-2">🏫</div>
          <h4 class="fw-bold">Acceso a la Comunidad</h4>
          <p class="text-muted small">Ingresa tus credenciales para continuar</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post">
          <div class="mb-3">
            <label class="form-label small fw-bold">Usuario / Correo</label>
            <input type="text" name="username" class="form-control" placeholder="Ej. admin o tu usuario" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <small class="text-muted d-block">Roles disponibles:</small>
          <span class="badge bg-danger">Soporte/TI</span>
          <span class="badge bg-primary">Docente</span>
          <span class="badge bg-warning text-dark">Vocal</span>
          <span class="badge bg-success">Padre</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
